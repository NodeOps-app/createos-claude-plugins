---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /packages/pi-extension
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /packages/langflow-sandbox-createos
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
